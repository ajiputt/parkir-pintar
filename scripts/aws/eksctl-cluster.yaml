apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# ============================================================================
# ParkirPintar — EKS Cluster Definition
# ============================================================================
# Reference: docs/architecture/adr/0017-deployment-eks.md
# Reference: docs/deployment/aws-eks-architecture.md
#
# Cluster lifecycle (Skenario A daily):
#   - Pagi:  .\scripts\aws\wake.ps1     → eksctl create cluster -f eksctl-cluster.yaml
#   - Sore:  .\scripts\aws\teardown.ps1 → eksctl delete cluster --name ajipur-parkir-staging
#
# Estimasi: 15-20 menit untuk provision, 8-10 menit untuk delete.
# ============================================================================

metadata:
  name: ajipur-parkir-staging
  region: ap-southeast-3
  # Upgrade dari 1.30 (extended support, lebih mahal $0.60/jam).
  # Versi tersedia per Mei 2026: 1.29 - 1.35.
  # Pakai 1.34 (N-1 dari latest 1.35) - balance stability + features.
  # Pakai 1.35 kalau mau bleeding edge.
  version: "1.34"
  tags:
    Project: parkir-pintar
    Environment: staging
    ManagedBy: eksctl
    CostCenter: ajipur-parkir-pintar-staging

# ---- VPC config ----
# eksctl auto-create VPC dengan 3-AZ public+private subnet.
# Untuk demo single-NAT (cost saving). Production: 1 NAT per AZ.
vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single  # Single | HighlyAvailable | Disable
  clusterEndpoints:
    publicAccess:  true   # demo: kubectl dari laptop. Prod: false (VPN/bastion)
    privateAccess: true

# ---- IAM with OIDC for IRSA ----
# IRSA = IAM Role for Service Account → pod-level AWS access tanpa long-lived key.
iam:
  withOIDC: true
  serviceAccounts:
    # AWS Load Balancer Controller — manage ALB dari K8s Ingress
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
      roleName: ajipur-parkir-alb-controller-role

    # External Secrets Operator — sync Secrets Manager → K8s Secret
    - metadata:
        name: external-secrets-sa
        namespace: external-secrets
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:ListSecrets
            Resource:
              - "arn:aws:secretsmanager:ap-southeast-3:*:secret:ajipur-parkir-pintar/*"
      roleName: ajipur-parkir-external-secrets-role

    # Notification service IRSA - SES SendEmail
    # roleOnly: true supaya eksctl HANYA bikin IAM role, gak bikin K8s SA.
    # SA-nya akan dibuat oleh Helm chart parkir-pintar (templates/serviceaccount.yaml)
    # dengan IRSA annotation pointing ke role ini. Mencegah label conflict
    # antara eksctl ("managed-by: eksctl") dan Helm ("managed-by: Helm").
    - metadata:
        name: notification
        namespace: parkir
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
      roleName: ajipur-parkir-notification-role
      roleOnly: true

# ---- Managed Node Groups ----
# Strategi: On-Demand sebagai baseline (reliable), Spot sebagai capacity boost.
# Kalau Spot pool kosong, On-Demand jamin minimal 1 node untuk system pods
# (ESO, ALB Controller, NATS). Avoid full-Spot risk di ap-southeast-3 yang
# Spot pool depth-nya terbatas.
managedNodeGroups:
  # Baseline: 1 On-Demand node - guaranteed availability untuk system pods.
  - name: workers-ondemand
    instanceTypes:
      - t3.medium
    spot: false
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        cloudWatch: true
    labels:
      role: worker
      lifecycle: on-demand
    tags:
      Project: parkir-pintar
      NodeGroup: workers-ondemand

  # Capacity boost: Spot untuk app workload (hemat 70% kalau available).
  # Diversify instance types supaya kalau satu pool kosong, eksctl coba pool lain.
  - name: workers-spot
    instanceTypes:
      - t3.medium
      - t3.large
      - m5.large
      - m6i.large
    spot: true
    desiredCapacity: 1   # turun dari 2 - On-Demand sudah cover baseline
    minSize: 0           # 0 supaya Spot bisa hilang tanpa ngeganggu
    maxSize: 3
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        cloudWatch: true
    labels:
      role: worker
      lifecycle: spot
    tags:
      Project: parkir-pintar
      NodeGroup: workers-spot

# ---- Add-ons (AWS managed) ----
# Plugin core yang AWS manage versinya supaya in-sync dengan cluster version.
addons:
  - name: vpc-cni
    version: latest
    configurationValues: |-
      env:
        ENABLE_PREFIX_DELEGATION: "true"  # support more pod per node
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
    wellKnownPolicies:
      ebsCSIController: true

# ---- CloudWatch Logging (optional, skip untuk demo cost saving) ----
# Uncomment kalau perlu cluster log aggregation:
# cloudWatch:
#   clusterLogging:
#     enableTypes: ["api", "audit", "authenticator"]

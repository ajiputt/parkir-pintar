# golangci-lint v2 config (migrated from v1).
# See https://golangci-lint.run/docs/configuration/v2/
version: "2"

run:
  timeout: 5m
  tests: true
  # Go version auto-detected dari go.mod (sekarang 1.25.0).

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck         # includes gosimple di v2 (merged)
    - unused
    - gocritic
    - gocyclo
    - revive
    - prealloc
    - nilerr
    - errorlint
    - exhaustive
    - contextcheck
    - durationcheck
    - copyloopvar
    - bodyclose
    - sqlclosecheck
    - rowserrcheck

  settings:
    gocyclo:
      min-complexity: 15
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck

  exclusions:
    # misspell di-disable karena codebase pakai komentar Indonesia
    # ("implementasi", dll.) yang flagged false positive oleh dictionary English.
    paths:
      - bin
      - proto/gen
      - vendor
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec

# v2: gofmt + goimports pindah ke `formatters` block (separate dari linters).
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ajiperdana/parkir-pintar

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

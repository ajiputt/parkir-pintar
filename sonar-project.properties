# SonarCloud project configuration.
# Quality Gate dikelola via SonarCloud UI (Administration → Quality Gates).
# Lihat ADR-0018 untuk detail strategy.

# ----- Project identity (dari SonarCloud dashboard) -----
# Org key: ajiputt (auto-generated, beda dengan display name "Aji Perdana Putra").
# Project key: ajiputt_parkir-pintar (visible di URL sonarcloud.io/project/overview?id=...).
sonar.projectKey=ajiputt_parkir-pintar
sonar.organization=ajiputt
sonar.projectName=parkir-pintar
sonar.projectVersion=1.0.0

# ----- Source code -----
sonar.sources=pkg,services
sonar.tests=pkg,services
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/integration/**,**/e2e/**

# Exclude generated proto stubs + vendor dirs + test data.
sonar.exclusions=\
    **/proto/gen/**,\
    **/*.pb.go,\
    **/*.pb.gw.go,\
    **/vendor/**,\
    **/bin/**,\
    **/testdata/**,\
    **/mocks/**,\
    **/_mock/**,\
    **/*_mock.go

# Coverage exclusions — file yang butuh integration tests, bukan unit tests.
#
# Rationale (per industry best practice + ADR-0018):
# - cmd/main.go      : bootstrap orchestrator, di-cover via E2E.
# - proto stubs      : generated code, no manual testing.
# - mocks            : test doubles, no self-coverage.
# - postgres/**      : DB adapters butuh real PostgreSQL (testcontainers di
#                      integration tests folder /test/integration/).
# - redis/**         : Redis adapters butuh real Redis (testcontainers).
# - nats/**          : NATS adapters butuh real NATS stream (testcontainers).
# - eventbus/nats.go : NATS connection wrapper, same as above.
# - lock/redis.go    : Redis-backed distributed lock, same.
# - db/postgres.go   : connection pool wrapper, integration-only.
# - idempotency/postgres.go : DB-backed idempotency store, integration-only.
#
# Unit-test-uncoverable code shouldn't drag down coverage metric — they have
# separate integration test suite (lihat /test/integration/).
sonar.coverage.exclusions=\
    **/cmd/main.go,\
    **/proto/gen/**,\
    **/*.pb.go,\
    **/mocks/**,\
    **/_mock/**,\
    **/*_mock.go,\
    **/internal/adapter/postgres/**,\
    **/internal/adapter/redis/**,\
    **/internal/adapter/nats/**,\
    **/pkg/eventbus/nats.go,\
    **/pkg/lock/redis.go,\
    **/pkg/db/**,\
    **/pkg/idempotency/postgres.go

# ----- Language config -----
sonar.go.coverage.reportPaths=coverage.out,**/coverage.out
sonar.go.tests.reportPaths=test-report.json,**/test-report.json
sonar.sourceEncoding=UTF-8

# ----- Quality Profile (defined di SonarCloud UI) -----
# Default: "Sonar way" for Go. Custom profile bisa di-import dari ADR-0018.

# ----- New Code definition -----
# Default: "Previous version" (sejak last release). Override via UI:
#   Administration → New Code → "Number of days" = 30

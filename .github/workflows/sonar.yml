name: SonarCloud Quality Gate

# Reusable workflow — dipanggil dari pipeline.yml setelah _unit-test selesai.
# Coverage artifact dari _unit-test di-download supaya tidak re-run tests (save ~3 min).
on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: '1.26.3'
        type: string
      coverage-artifact:
        description: 'Nama artifact coverage dari _unit-test job'
        required: false
        default: 'coverage-report'
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # SonarCloud butuh history penuh untuk blame/new-code mode.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Disable shallow clone

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }

      # Proto stubs di-generate ulang — Sonar source paths reference paket yg compile-able.
      - name: Generate proto stubs
        run: cd proto && buf generate

      # Download coverage artifact dari _unit-test (sudah jalan di pipeline DAG sebelumnya).
      # Skip re-running tests → save ~3 min vs sebelumnya.
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .

      - name: Verify coverage report exists
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out not found in artifact"
            exit 1
          fi
          echo "==> Coverage summary:"
          go tool cover -func=coverage.out | tail -1

      # Run gosec dengan sonarqube format supaya Sonar bisa ingest security findings
      # sebagai Security Hotspots di dashboard.
      - name: Run gosec for Sonar
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -no-fail -fmt=sonarqube -out=gosec-report.json ./... || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}        # auth ke SonarCloud
        with:
          # sonar-project.properties di repo root - args optional.
          args: >
            -Dsonar.go.gosec.reportPaths=gosec-report.json

      # ----- Wait Quality Gate hasil -----
      # SonarCloud asynchronous: scan submit dulu, lalu polling hasil.
      - name: SonarCloud Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

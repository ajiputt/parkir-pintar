name: _build-images

# Reusable workflow — build & push container images ke GHCR + ECR.
# Matrix per service. Push HANYA dilakukan kalau dipanggil dengan inputs.push == 'true'
# (orchestrator pipeline.yml pakai gating supaya cuma push di branch main).

on:
  workflow_call:
    inputs:
      push:
        description: 'Push image ke registry (true di main, false di PR)'
        required: false
        default: 'false'
        type: string
      aws-region:
        required: false
        default: 'ap-southeast-3'
        type: string
      ecr-prefix:
        required: false
        default: 'ajipur-parkir-pintar'
        type: string
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: false   # Optional di PR (push=false skip ECR login)
    outputs:
      image-tag:
        description: 'Short SHA tag yang di-build'
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC ke AWS
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    strategy:
      matrix:
        # search & presence: deferred (ADR-0009)
        service: [gateway, reservation, billing, payment, notification]
      fail-fast: false   # Build semua service walaupun satu fail (cleaner debug)
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate

      - uses: docker/setup-buildx-action@v3

      # ----- Login GHCR (selalu, baik PR maupun main) -----
      # GHCR push butuh GITHUB_TOKEN (auto-provided), no extra secrets.
      - uses: docker/login-action@v3
        if: inputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----- Login ECR (cuma kalau push) -----
      - name: Configure AWS credentials (OIDC)
        if: inputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        if: inputs.push == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Compute short SHA (7-char) supaya tag image cocok dengan default deploy
      # yang pakai `git rev-parse --short HEAD`. Outputkan ke job-level supaya
      # caller pipeline bisa pass tag ke _deploy job.
      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build always; push only kalau inputs.push == 'true' (main branch).
      - name: Build & push (PR — build only)
        if: inputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: parkir-pintar/${{ matrix.service }}:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (main — GHCR + ECR)
        if: inputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-prefix }}/${{ matrix.service }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-prefix }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-prefix }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

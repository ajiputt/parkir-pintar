name: _e2e-test

# Reusable workflow — end-to-end test pakai full stack docker-compose.
# Long-running (~5-8 min) karena boot up entire system + run scenario.

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: '1.26.3'
        type: string

jobs:
  e2e-test:
    name: E2E Tests (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate

      - name: Bring up stack
        run: |
          docker compose -f deploy/docker/docker-compose.yml up -d --build
          ./scripts/wait-healthy.sh

      - name: Run e2e tests
        run: |
          cd test
          go test -tags=e2e -v -timeout=10m ./e2e/...

      # Always tear down — even on test fail — supaya runner clean.
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v

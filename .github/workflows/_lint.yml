name: _lint

# Reusable workflow — dipanggil dari pipeline.yml.
# Single concern: static analysis (golangci-lint v2 + buf lint + buf breaking).
# Tier 1 lint enforced (blocking). Tier 2 di-delegate ke SonarCloud — lihat ADR-0018.

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go toolchain version'
        required: false
        default: '1.26.3'
        type: string

jobs:
  lint:
    name: Lint (golangci-lint, buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }

      - name: buf lint
        run: cd proto && buf lint

      # Breaking change check soft — flag aja, jangan block, supaya intentional
      # API evolution di main gak nge-block PR yang sama-sama propagate breakage.
      - name: buf breaking change (vs main)
        run: cd proto && buf breaking --against '../.git#branch=main,subdir=proto' || true

      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate

      # golangci-lint v2.x — Tier 1 enforcement (BLOCKING).
      # Config di .golangci.yml. Tier 2 di-handle SonarCloud.
      - name: golangci-lint (pkg)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
          working-directory: pkg

      - name: golangci-lint (services)
        run: |
          for s in services/reservation services/billing services/payment services/gateway services/notification; do
            (cd $s && golangci-lint run --timeout=5m ./...) || true
          done

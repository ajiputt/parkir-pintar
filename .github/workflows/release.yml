name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      # Build & push images dengan tag = git tag
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all images
        run: |
          # search & presence: deferred (ADR-0009)
          for s in gateway reservation billing payment notification; do
            docker buildx build --push \
              -t ghcr.io/${{ github.repository }}/$s:${{ github.ref_name }} \
              -t ghcr.io/${{ github.repository }}/$s:latest \
              -f services/$s/Dockerfile .
          done

      # Helm chart package
      - uses: azure/setup-helm@v4
        with: { version: 'v3.15.2' }
      - name: Package & push Helm chart
        run: |
          cd deploy/helm
          helm package parkir-pintar
          # Push ke OCI registry
          helm push parkir-pintar-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts || true

      # Release notes
      - name: Generate changelog
        run: |
          echo "## ParkirPintar ${{ github.ref_name }}" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md || true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md

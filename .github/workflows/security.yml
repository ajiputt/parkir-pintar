name: Security Scan

# Triggers:
# - workflow_call    : dipanggil dari pipeline.yml di setiap push/PR ke main.
# - schedule (weekly): full deep-scan setiap Senin 04:00 UTC (independent dari pipeline).
# - workflow_dispatch: manual trigger untuk ad-hoc scan.
on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: '1.26.3'
        type: string
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.go-version || ''1.26.3'' }}' }
      # Proto stubs di-generate dari .proto files (gitignored).
      # gosec scan dependency tree butuh package proto/gen/* exist.
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs
        run: cd proto && buf generate
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: gosec.sarif }

  govulncheck:
    name: govulncheck (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ inputs.go-version || ''1.26.3'' }}' }
      # Proto stubs di-generate dari .proto files (gitignored).
      # govulncheck butuh package tree complete supaya bisa trace symbol usage.
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs
        run: cd proto && buf generate
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Scan tiap module — track fail-count untuk decide overall workflow result.
      # Tanpa `|| true` supaya CI nge-block kalau ada vulnerability baru ke-introduce.
      - name: Run govulncheck (fail-on-vuln)
        run: |
          set +e   # disable exit-on-error supaya bisa aggregate hasil
          FAIL=0
          for m in pkg services/reservation services/billing services/payment services/gateway services/notification; do
            echo ""
            echo "=========================================="
            echo "==> Scanning $m"
            echo "=========================================="
            (cd $m && govulncheck ./...)
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::warning::Vulnerabilities found in $m (exit $rc)"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "==========================================="
          if [ $FAIL -eq 0 ]; then
            echo "[OK] All modules clean — no vulnerabilities"
            exit 0
          else
            echo "[FAIL] $FAIL module(s) reported vulnerabilities"
            echo "::error::Fix or accept (via ADR) before merge"
            exit 1
          fi

  trivy:
    name: Trivy (image + IaC scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, reservation, billing, payment]
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - name: Build image
        run: docker build -t parkir-pintar/${{ matrix.service }}:scan -f services/${{ matrix.service }}/Dockerfile .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: parkir-pintar/${{ matrix.service }}:scan
          severity: 'HIGH,CRITICAL'
          exit-code: '0'   # demo: log only. Production: '1'.
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  iac-scan:
    name: Terraform / Helm scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,helm,dockerfile,kubernetes
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: checkov.sarif }

  secrets-scan:
    name: Secret leakage check (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

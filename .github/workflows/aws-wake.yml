name: AWS — Wake Up (start working day)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'demo'
        type: choice
        options: [demo, staging]
  # Auto-wake setiap weekday jam 08:00 WIB (= 01:00 UTC)
  # Comment kalau mau full manual.
  schedule:
    - cron: '0 1 * * 1-5'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1

jobs:
  wake:
    name: Wake AWS stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve env
        id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'demo' }}"
          echo "env=$ENV" >> $GITHUB_OUTPUT

      - name: Start RDS instance (if stopped)
        run: |
          INSTANCE="parkir-${{ steps.env.outputs.env }}"
          STATUS=$(aws rds describe-db-instances --db-instance-identifier $INSTANCE \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "missing")
          echo "RDS status: $STATUS"
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier $INSTANCE
            echo "Waiting for RDS available..."
            aws rds wait db-instance-available --db-instance-identifier $INSTANCE
          fi

      - name: Scale ECS services up
        run: |
          CLUSTER="parkir-${{ steps.env.outputs.env }}"
          # search & presence: deferred (ADR-0009)
          declare -A REPLICAS=(
            [gateway]=2 [reservation]=2 [billing]=1
            [payment]=1 [notification]=1
          )
          for svc in "${!REPLICAS[@]}"; do
            echo "==> Scale $svc → ${REPLICAS[$svc]}"
            aws ecs update-service \
              --cluster $CLUSTER --service $svc \
              --desired-count ${REPLICAS[$svc]} \
              --no-cli-pager > /dev/null
          done

      - name: Wait services stable
        run: |
          CLUSTER="parkir-${{ steps.env.outputs.env }}"
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services gateway reservation billing payment notification

      - name: Smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --names parkir-${{ steps.env.outputs.env }} \
            --query 'LoadBalancers[0].DNSName' --output text)
          for i in 1 2 3 4 5; do
            if curl -sf "http://$ALB/healthz"; then
              echo "✅ Stack awake at http://$ALB"
              exit 0
            fi
            sleep 15
          done
          exit 1

name: _unit-test

# Reusable workflow — dipanggil dari pipeline.yml.
# Run go test dengan -race + coverage per module, merge ke 1 file `coverage.out`.
# Coverage artifact di-upload supaya _sonar.yml bisa download tanpa re-run tests.

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: '1.26.3'
        type: string
    outputs:
      coverage-artifact:
        description: 'Nama artifact coverage yang di-upload (download di sonar)'
        value: 'coverage-report'

jobs:
  unit-test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }

      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate

      # Run race-detector test + coverage per module. Aggregate ke coverage.out
      # di repo root supaya Sonar Go scanner bisa map ke source paths.
      - name: Run unit tests with race detector
        run: |
          set -e
          mkdir -p coverage-reports

          for m in pkg services/gateway services/reservation services/billing services/payment services/notification; do
            echo "==> Test + coverage: $m"
            (cd $m && go test -race -coverprofile=coverage.out -covermode=atomic ./...)

            mod_name=$(echo $m | tr '/' '_')
            if [ -f "$m/coverage.out" ]; then
              cp "$m/coverage.out" "coverage-reports/${mod_name}.out"
            fi
          done

          # Merge semua coverage jadi 1 file (Sonar Go scanner pakai standard format).
          echo "mode: atomic" > coverage.out
          for f in coverage-reports/*.out; do
            tail -n +2 "$f" >> coverage.out
          done

          echo "==> Total coverage:"
          go tool cover -func=coverage.out | tail -1

      # Upload merged coverage sebagai artifact untuk consumption oleh _sonar.yml.
      # Pakai retention-days minim — coverage tidak butuh persist lama.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-reports/
          retention-days: 1

      # Backup: codecov upload (kalau codecov masih dipake parallel ke Sonar).
      - name: Upload coverage to Codecov (pkg only)
        uses: codecov/codecov-action@v4
        with:
          files: ./pkg/coverage.out
          flags: pkg
        continue-on-error: true

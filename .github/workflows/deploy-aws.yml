name: Deploy to AWS (ECS Fargate)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'demo'
        type: choice
        options: [demo, staging, prod]
      image_tag:
        description: 'Image tag to deploy (default: short SHA of current commit)'
        required: false
        default: ''
      apply_terraform:
        description: 'Run terraform apply (false = only update ECS services)'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  id-token: write   # OIDC ke AWS

env:
  AWS_REGION: ap-southeast-1
  TF_DIR: deploy/terraform/aws-ecs

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://${{ steps.tf-output.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----- Terraform apply (opsional) -----
      - uses: hashicorp/setup-terraform@v3
        if: github.event.inputs.apply_terraform == 'true'
        with:
          terraform_version: '1.9.0'

      - name: Terraform init
        if: github.event.inputs.apply_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=parkir-pintar/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform plan
        if: github.event.inputs.apply_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var environment=${{ github.event.inputs.environment }} \
            -var image_tag=${{ steps.tag.outputs.tag }} \
            -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.apply_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform outputs
        id: tf-output
        if: github.event.inputs.apply_terraform == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "alb_dns=$(terraform output -raw alb_dns)" >> $GITHUB_OUTPUT

      # ----- Update ECS services dengan image baru -----
      - name: Force new deployment per service
        run: |
          CLUSTER="parkir-${{ github.event.inputs.environment }}"
          # search & presence: deferred (ADR-0009)
          for svc in gateway reservation billing payment notification; do
            echo "==> Update ECS service: $svc"
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $svc \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }} \
              --no-cli-pager > /dev/null
          done

      - name: Wait for stable
        run: |
          CLUSTER="parkir-${{ github.event.inputs.environment }}"
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services gateway reservation billing payment notification \
            --region ${{ env.AWS_REGION }}

      # ----- Smoke test -----
      - name: Smoke test gateway
        run: |
          # Allow few seconds untuk ALB target health check
          sleep 30
          ALB=$(aws elbv2 describe-load-balancers \
            --names parkir-${{ github.event.inputs.environment }} \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "Smoke testing http://$ALB/healthz"
          for i in 1 2 3 4 5; do
            if curl -sf "http://$ALB/healthz"; then
              echo "✅ Healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Smoke test failed"
          exit 1

      - name: Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured, skipping notification"
            exit 0
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"AWS deploy $ENVIRONMENT → $STATUS (image=$IMAGE_TAG)\"}" \
            "$SLACK_WEBHOOK_URL" || true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.24'

jobs:
  lint:
    name: Lint (golangci-lint, buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: buf lint
        run: cd proto && buf lint
      - name: buf breaking change (vs main)
        run: cd proto && buf breaking --against '../.git#branch=main,subdir=proto' || true
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
          working-directory: pkg
      - name: golangci-lint (services)
        run: |
          for s in services/reservation services/billing services/payment services/gateway; do
            (cd $s && golangci-lint run --timeout=5m ./...) || true
          done

  unit-test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - name: Run unit tests with race detector
        run: |
          for m in pkg services/reservation services/billing services/payment; do
            echo "==> $m"
            (cd $m && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done
      - name: Upload coverage (pkg)
        uses: codecov/codecov-action@v4
        with:
          files: ./pkg/coverage.out
          flags: pkg
        continue-on-error: true

  integration-test:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      docker:
        image: docker:24-dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - name: Run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd test
          go test -tags=integration -race -timeout=10m ./integration/...

  e2e-test:
    name: E2E Tests (docker-compose)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - name: Bring up stack
        run: |
          docker compose -f deploy/docker/docker-compose.yml up -d --build
          ./scripts/wait-healthy.sh
      - name: Run e2e tests
        run: |
          cd test
          go test -tags=e2e -v -timeout=10m ./e2e/...
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v

  build-images:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write   # OIDC ke AWS untuk push ECR
    strategy:
      matrix:
        # search & presence: deferred (ADR-0009)
        service: [gateway, reservation, billing, payment, notification]
    env:
      AWS_REGION: ap-southeast-3
      ECR_PREFIX: ajipur-parkir-pintar
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with: { version: '1.34.0' }
      - name: Generate proto stubs (buf generate)
        run: cd proto && buf generate
      - uses: docker/setup-buildx-action@v3

      # ----- Login GHCR (public visibility) -----
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----- Login ECR (untuk EKS deploy) -----
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push (GHCR + ECR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.service }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: AWS — Teardown (weekend / pre-presentation cleanup)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to TEAR DOWN'
        required: true
        type: choice
        options: [demo, staging]
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_DIR: deploy/terraform/aws-ecs

jobs:
  teardown:
    name: Destroy AWS infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ Confirmation tidak valid. Type 'DESTROY' untuk lanjut."
            exit 1
          fi
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "❌ Refuse to teardown prod via workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=parkir-pintar/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Backup RDS snapshot (manual)
        run: |
          INSTANCE="parkir-${{ github.event.inputs.environment }}"
          SNAP="parkir-${{ github.event.inputs.environment }}-pre-teardown-$(date +%Y%m%d-%H%M)"
          echo "Creating snapshot $SNAP..."
          aws rds create-db-snapshot \
            --db-instance-identifier $INSTANCE \
            --db-snapshot-identifier $SNAP || echo "(snapshot may have failed — RDS might be stopped)"

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var environment=${{ github.event.inputs.environment }}

      - name: Cost reminder
        run: |
          echo "✅ Stack destroyed. Charges yang berhenti total:"
          echo "   ECS Fargate, RDS, ElastiCache, ALB, NAT Gateway"
          echo ""
          echo "Yang masih nempel (manual cleanup kalau mau full \$0):"
          echo "   - Manual RDS snapshot (preserved): \$0.095/GB/month"
          echo "   - S3 Terraform state bucket"
          echo "   - Secrets Manager: \$0.40/secret/month"
          echo "   - CloudWatch log groups (delete manual via console)"

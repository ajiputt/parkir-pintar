version: v2
modules:
  - path: .
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - DEFAULT
  except:
    - PACKAGE_VERSION_SUFFIX
    # ENUM_VALUE_PREFIX di-except: kita pakai short form (CAR, SYSTEM, PAID)
    # untuk JSON ergonomics. Lihat naming convention di proto/common/v1/types.proto.
    # Zero values tetap pakai prefix (VEHICLE_TYPE_UNSPECIFIED dst) karena proto3
    # enum values share package scope.
    - ENUM_VALUE_PREFIX
    # RPC_REQUEST_RESPONSE_UNIQUE di-except: kita reuse domain message
    # (Invoice, Reservation, Payment) sebagai response untuk multiple RPC.
    # Buf default expect dedicated GetInvoiceResponse/MarkPaidResponse/etc, tapi
    # ini menambah noise tanpa value (response single-field wrapper). Trade-off
    # diambil untuk JSON ergonomics + thinner proto surface area.
    - RPC_REQUEST_RESPONSE_UNIQUE
    # RPC_RESPONSE_STANDARD_NAME di-except: alasan sama. Domain message sebagai
    # response langsung lebih natural untuk grpc-gateway REST translation
    # (response = resource shape, bukan envelope wrapper).
    - RPC_RESPONSE_STANDARD_NAME
    # RPC_REQUEST_STANDARD_NAME di-except: untuk RPC seperti HandleWebhook
    # (request = WebhookPayload, raw payload dari Midtrans) dan presence stream
    # (request = LocationUpdate event), domain naming lebih ekspresif daripada
    # generic <RPC>Request. Trade-off konsisten dengan RESPONSE rule di atas.
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE

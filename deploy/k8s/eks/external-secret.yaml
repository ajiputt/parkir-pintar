# External Secrets Operator (ESO) — sync dari AWS Secrets Manager → K8s Secret.
#
# Prerequisite:
#   1. ESO installed di cluster (lihat aws-eks-architecture.md §5.2)
#   2. ClusterSecretStore "aws-secrets-manager" sudah dikonfigurasi
#      dengan IRSA pointing ke role yang bisa read parkir-pintar/* paths
#   3. Secrets di AWS Secrets Manager sudah dibuat:
#      - parkir-pintar/db-url
#      - parkir-pintar/midtrans-server-key
#      - parkir-pintar/jwt-secret
#      - parkir-pintar/notification-ses-region (kalau perlu)
#
# Apply:
#   kubectl apply -f deploy/k8s/eks/external-secret.yaml -n parkir
#
# Result: K8s Secret "parkir-secrets" akan otomatis populate + auto-refresh
# tiap 1 jam. Helm chart reference Secret ini via secretKeyRef.

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: parkir-secrets
  namespace: parkir
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: parkir-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: parkir-pintar
  data:
    - secretKey: db-url
      remoteRef:
        key: parkir-pintar/db-url
    - secretKey: midtrans-server-key
      remoteRef:
        key: parkir-pintar/midtrans-server-key
    - secretKey: jwt-secret
      remoteRef:
        key: parkir-pintar/jwt-secret

{{- /*
Migration Job — pre-install/pre-upgrade hook.

Jalanin setiap helm install / upgrade:
  1. Init container: extract ConfigMap migrations ke /migrations folder
     dengan structure schema/file.sql (rebuild dari flat key path)
  2. Main container: run migrate CLI per schema, urut nama file
  3. Job complete -> Helm lanjut install/upgrade app pods
  4. Kalau Job fail, Helm rollback (atomic)

DB credentials via K8s Secret parkir-secrets (di-sync oleh ExternalSecret
dari AWS Secrets Manager). ESO harus running + secret available SEBELUM
helm install.

Hook-weight 0 (default), di-eksekusi setelah ConfigMap (-10).
Delete policy: hook-succeeded supaya Job ke-cleanup setelah sukses.
Tetap visible di kubectl logs sampai dihapus untuk debugging.
*/}}
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: parkir-migrate-{{ now | unixEpoch }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: parkir-migrate
    app.kubernetes.io/part-of: parkir-pintar
    app.kubernetes.io/managed-by: helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600   # 10 menit timeout
  ttlSecondsAfterFinished: 3600  # auto-cleanup setelah 1 jam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parkir-migrate
        app.kubernetes.io/part-of: parkir-pintar
    spec:
      restartPolicy: OnFailure

      # ----- Init containers -----
      initContainers:
        # 1. Rebuild folder structure dari flat ConfigMap keys
        - name: rebuild-migrations-tree
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "==> Rebuild migrations folder structure"
              for f in /flat/*; do
                fname=$(basename "$f")
                # ConfigMap key: schema--filename.sql -> /migrations/schema/filename.sql
                schema=$(echo "$fname" | sed 's/--.*//')
                file=$(echo "$fname" | sed 's/^[^-]*--//')
                mkdir -p "/migrations/$schema"
                cp "$f" "/migrations/$schema/$file"
              done
              echo "==> Tree ready:"
              ls -R /migrations
          volumeMounts:
            - name: flat-migrations
              mountPath: /flat
              readOnly: true
            - name: migrations
              mountPath: /migrations

        # 2. Pre-create extensions + schemas SEBELUM migrate CLI jalan.
        # migrate CLI butuh schema_migrations table di schema target. Tanpa
        # pre-create schema, migrate connect pakai search_path=reservation
        # lalu gagal bikin schema_migrations karena schema belum exist.
        - name: init-db-schemas
          image: postgres:16-alpine
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: parkir-secrets
                  key: db-url
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "==> Pre-create extensions + 4 schemas di DB"
              psql "$DB_URL" <<'SQL'
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
              CREATE EXTENSION IF NOT EXISTS btree_gist;
              CREATE SCHEMA IF NOT EXISTS reservation;
              CREATE SCHEMA IF NOT EXISTS billing;
              CREATE SCHEMA IF NOT EXISTS payment;
              CREATE SCHEMA IF NOT EXISTS notification;
              SQL
              echo "==> Schemas ready"

        # 3. Run migrate CLI per schema (moved to init supaya berurutan dengan seed).
        - name: run-migrate
          image: migrate/migrate:v4.17.1
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: parkir-secrets
                  key: db-url
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "==> Verify DB_URL di-set"
              if [ -z "$DB_URL" ]; then
                echo "[FAIL] DB_URL env empty - parkir-secrets gak ada?"
                exit 1
              fi
              echo "==> Apply migrations per schema"
              for schema in reservation billing payment notification; do
                if [ ! -d "/migrations/$schema" ]; then
                  echo "[SKIP] /migrations/$schema folder tidak ada"
                  continue
                fi
                echo "==> migrate $schema"
                migrate -path "/migrations/$schema" \
                  -database "${DB_URL}&search_path=${schema}" up
              done
              echo "==> All migrations complete"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true

        # 4. Seed initial demo data (parking area + 5 floors + 750 spots).
        # Idempotent: DELETE existing data dengan name='ParkirPintar Main' dulu,
        # lalu re-insert. Aman di-run berulang kali (helm upgrade trigger ini).
        - name: seed-demo-data
          image: postgres:16-alpine
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: parkir-secrets
                  key: db-url
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "==> Seed parking area + 5 floor + 750 spot"
              psql "$DB_URL" <<'SQL'
              SET search_path TO reservation, public;

              -- Idempotent seed: hapus dulu kalau sudah ada area 'ParkirPintar Main'.
              DELETE FROM reservation WHERE spot_id IN (
                  SELECT s.id FROM spot s
                  JOIN floor f ON f.id = s.floor_id
                  JOIN parking_area a ON a.id = f.area_id
                  WHERE a.name = 'ParkirPintar Main'
              );
              DELETE FROM spot WHERE floor_id IN (
                  SELECT f.id FROM floor f
                  JOIN parking_area a ON a.id = f.area_id
                  WHERE a.name = 'ParkirPintar Main'
              );
              DELETE FROM floor WHERE area_id IN (SELECT id FROM parking_area WHERE name = 'ParkirPintar Main');
              DELETE FROM parking_area WHERE name = 'ParkirPintar Main';

              -- Insert area.
              INSERT INTO parking_area (id, name, address, timezone)
              VALUES ('11111111-1111-1111-1111-111111111111',
                      'ParkirPintar Main',
                      'Jl. Sudirman No. 1, Jakarta',
                      'Asia/Jakarta');

              -- Insert 5 floors.
              INSERT INTO floor (area_id, level, car_capacity, motor_capacity)
              SELECT '11111111-1111-1111-1111-111111111111', g, 30, 50
              FROM generate_series(1, 5) g;

              -- Insert spots: 30 mobil + 50 motor per floor.
              -- Pakai tagged dollar quote $body$ instead of bare $$ untuk
              -- avoid YAML/Helm escape ambiguity yang strip salah satu $.
              DO $body$
              DECLARE
                f RECORD;
                i INT;
              BEGIN
                FOR f IN SELECT id, level FROM floor WHERE area_id = '11111111-1111-1111-1111-111111111111' ORDER BY level LOOP
                  FOR i IN 1..30 LOOP
                    INSERT INTO spot (floor_id, code, vehicle_type)
                    VALUES (f.id, format('F%s-C-%s', f.level, lpad(i::text, 3, '0')), 'CAR');
                  END LOOP;
                  FOR i IN 1..50 LOOP
                    INSERT INTO spot (floor_id, code, vehicle_type)
                    VALUES (f.id, format('F%s-M-%s', f.level, lpad(i::text, 3, '0')), 'MOTOR');
                  END LOOP;
                END LOOP;
              END
              $body$;

              -- Verify counts
              SELECT
                (SELECT count(*) FROM parking_area WHERE name='ParkirPintar Main') AS areas,
                (SELECT count(*) FROM floor WHERE area_id='11111111-1111-1111-1111-111111111111') AS floors,
                (SELECT count(*) FROM spot s JOIN floor f ON f.id=s.floor_id WHERE f.area_id='11111111-1111-1111-1111-111111111111' AND s.vehicle_type='CAR') AS car_spots,
                (SELECT count(*) FROM spot s JOIN floor f ON f.id=s.floor_id WHERE f.area_id='11111111-1111-1111-1111-111111111111' AND s.vehicle_type='MOTOR') AS motor_spots;
              SQL
              echo "==> Seed complete (1 area x 5 floor x (30 car + 50 motor) = 750 spots)"

      # ----- Main container: dummy completion marker -----
      # Semua kerja real di init containers (rebuild -> schema -> migrate -> seed).
      # Main container cuma exit sukses supaya Job selesai.
      containers:
        - name: done
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - 'echo "[OK] Migration + seed complete"'

      volumes:
        - name: flat-migrations
          configMap:
            name: parkir-migrations
        - name: migrations
          emptyDir: {}
{{- end }}

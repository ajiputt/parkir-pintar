{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (ne $name "gateway") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: parkir-pintar
    env: {{ $.Values.global.env }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: parkir-pintar
    spec:
      # Service account dengan IRSA annotation (kalau iamRoleArn di-set di values).
      # Tanpa ini, pod fallback ke 'default' SA -> NodeInstanceRole -> SES denied.
      serviceAccountName: {{ $name }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
            {{- if $svc.httpPort }}
            - name: http
              containerPort: {{ $svc.httpPort }}
            {{- end }}
          env:
            - name: APP_ENV
              value: {{ $.Values.global.env | quote }}
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.opentelemetry.endpoint | quote }}
            - name: NATS_URL
              value: {{ $.Values.nats.url | quote }}
            - name: NATS_STREAM
              value: {{ $.Values.nats.stream | quote }}
            - name: REDIS_ADDR
              value: {{ $.Values.redis.addr | quote }}
            # DB_URL_BASE dari secret (base URL tanpa search_path).
            # DB_URL composed dengan append &search_path=<service-name> supaya
            # query di service nge-resolve ke schema yang bener (table parking_area
            # ada di schema 'reservation', dst).
            - name: DB_URL_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.databaseSecret }}
                  key: {{ $.Values.postgres.databaseSecretKey }}
            - name: DB_URL
              value: "$(DB_URL_BASE)&search_path={{ $name }}"
            {{- if eq $name "reservation" }}
            - name: RESERVATION_GRPC_ADDR
              value: ":{{ $svc.grpcPort }}"
            - name: RESERVATION_HTTP_ADDR
              value: ":{{ $svc.httpPort }}"
            - name: RESERVATION_HOLD_DURATION
              value: {{ $svc.holdDuration | quote }}
            - name: RESERVATION_EXPIRY_SCAN_INTERVAL
              value: {{ $svc.expiryScanInterval | quote }}
            {{- end }}
            {{- if eq $name "billing" }}
            - name: BILLING_GRPC_ADDR
              value: ":{{ $svc.grpcPort }}"
            - name: BILLING_HTTP_ADDR
              value: ":{{ $svc.httpPort }}"
            {{- end }}
            {{- if eq $name "payment" }}
            - name: PAYMENT_GRPC_ADDR
              value: ":{{ $svc.grpcPort }}"
            - name: PAYMENT_HTTP_ADDR
              value: ":{{ $svc.httpPort }}"
            - name: PAYMENT_MOCK_MODE
              value: {{ $svc.midtrans.mockMode | quote }}
            # AUTO payment mode — handler subscribe `billing.invoice.issued.v1`
            # dan langsung mark PAID + publish `payment.succeeded.v1` (skip Midtrans).
            # Default false di values.yaml; production override ke false; demo EKS
            # override ke true. Lihat ADR-0014.
            - name: PAYMENT_AUTO_PAY
              value: {{ $svc.autoPay | default false | quote }}
            # Payment service call billing via gRPC (cross-service blocking check)
            - name: BILLING_GRPC_ADDR
              value: "billing:{{ $.Values.services.billing.grpcPort }}"
            - name: MIDTRANS_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.midtrans.serverKeySecret }}
                  key: {{ $svc.midtrans.serverKeySecretKey }}
                  optional: true
            {{- end }}
            {{- if eq $name "notification" }}
            # Templates di-COPY ke /templates di Dockerfile distroless image.
            # Override default path "services/notification/templates" yang gak
            # exist di runtime container.
            - name: NOTIFICATION_TEMPLATE_DIR
              value: /templates
            # SES config — set NOTIFICATION_MOCK_SES=false untuk send email beneran.
            # SES_FROM harus verified identity di AWS SES (di sandbox: mandatory).
            - name: NOTIFICATION_MOCK_SES
              value: {{ $svc.ses.mockMode | default "false" | quote }}
            - name: SES_FROM
              value: {{ $svc.ses.fromEmail | default "noreply@parkirpintar.id" | quote }}
            - name: SES_REPLY_TO
              value: {{ $svc.ses.replyToEmail | default "" | quote }}
            - name: AWS_REGION
              value: {{ $.Values.global.eks.region | default "ap-southeast-3" | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    {{- if $svc.grpcPort }}
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: grpc
    {{- end }}
    {{- if $svc.httpPort }}
    - name: http
      port: {{ $svc.httpPort }}
      targetPort: http
    {{- end }}
{{- end }}
{{- end }}

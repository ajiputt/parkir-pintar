{{/*
ServiceAccount per service dengan optional IRSA annotation.

EKS only: kalau values.global.eks.enabled=true dan
values.services.<name>.iamRoleArn di-set, ServiceAccount akan dapat
IAM role mapping via OIDC. Pod yang pakai serviceAccountName ini
otomatis dapat AWS credentials tanpa env vars.

Non-EKS (vanilla K8s, OCP): annotation di-skip, plain ServiceAccount.

Lihat: docs/architecture/adr/0017-deployment-eks.md §IRSA
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: parkir-pintar
  {{- if and $.Values.global.eks $.Values.global.eks.enabled $svc.iamRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $svc.iamRoleArn | quote }}
  {{- end }}
{{- end }}
{{- end }}

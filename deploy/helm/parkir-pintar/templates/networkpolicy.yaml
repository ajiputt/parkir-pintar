{{- if .Values.networkPolicy.enabled }}
# Default deny + allow gateway → backends, all → DB/Redis/NATS via egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-backends
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: parkir-pintar
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
    - from: []   # ingress dari ingress controller
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: parkir-pintar
    # DNS resolution - HARUS allow port 53 untuk resolve service name
    # (nats.parkir-system.svc.cluster.local dll). Tanpa ini, semua
    # cross-namespace service lookup gagal.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # NATS cross-namespace (parkir-system) - allow egress ke pod NATS langsung
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: parkir-system
      ports:
        - port: 4222
    # External (RDS, ElastiCache Redis, Midtrans API). Restrict via CIDR di prod.
    - to: []
      ports:
        - port: 5432   # Postgres RDS
        - port: 6379   # Redis ElastiCache
        - port: 443    # HTTPS (Midtrans, SES, etc)
{{- end }}

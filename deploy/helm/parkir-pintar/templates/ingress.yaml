{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parkir-gateway
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    # Fixed-response action: kembalikan 404 untuk /metrics + /healthz + /readyz.
    # /metrics: cegah operational metric leak ke public (Prometheus scrape tetap
    #           via internal ClusterIP, observability namespace).
    # /healthz, /readyz: internal probes; tidak perlu di-expose.
    # Lihat ADR-0016 (security posture).
    alb.ingress.kubernetes.io/actions.deny-internal: |
      {"Type":"fixed-response","FixedResponseConfig":{"ContentType":"text/plain","StatusCode":"404","MessageBody":"Not Found"}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.domain }}]
      secretName: parkir-tls
  {{- end }}
  rules:
    -
      {{- if .Values.global.domain }}
      host: {{ .Values.global.domain }}
      {{- end }}
      http:
        paths:
          # Priority order: more specific paths first. Exact match untuk
          # internal endpoint supaya gak masuk ke gateway business handler.
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          # Catch-all untuk business endpoint (REST /v1/*, /docs, /openapi.json).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
{{- end }}

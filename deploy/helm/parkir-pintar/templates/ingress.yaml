{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parkir-gateway
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    # Fixed-response action: kembalikan 404 untuk /metrics.
    # Cegah operational metric leak ke public; Prometheus scrape tetap via
    # internal ClusterIP di namespace observability.
    #
    # /healthz dan /readyz SENGAJA tetap public-accessible:
    #   - ALB target group health check butuh reachable
    #   - Smoke test post-deploy hit /healthz
    #   - External uptime monitoring (e.g., UptimeRobot)
    #   - Tidak ada data leak — cuma 200 OK / 503 status
    #
    # Lihat ADR-0016 (security posture).
    alb.ingress.kubernetes.io/actions.deny-internal: |
      {"Type":"fixed-response","FixedResponseConfig":{"ContentType":"text/plain","StatusCode":"404","MessageBody":"Not Found"}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.domain }}]
      secretName: parkir-tls
  {{- end }}
  rules:
    -
      {{- if .Values.global.domain }}
      host: {{ .Values.global.domain }}
      {{- end }}
      http:
        paths:
          # Priority order: more specific path first. Exact match /metrics
          # supaya gak masuk ke gateway business handler.
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          # Catch-all untuk business endpoint + /healthz + /readyz + /docs.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parkir-gateway
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    # Fixed-response action: kembalikan 404 untuk path internal-only.
    #
    # Blocked dari public:
    #   - /metrics       : operational metric leak (Prometheus scrape internal only)
    #   - /docs          : Swagger UI — reveal API surface ke recon attacker
    #   - /openapi.json  : same — full schema
    #
    # Akses /docs dan Swagger di staging/EKS:
    #   kubectl port-forward -n parkir svc/gateway 8080:80
    #   → buka http://localhost:8080/docs
    #
    # /healthz dan /readyz SENGAJA tetap public-accessible:
    #   - ALB target group health check butuh reachable
    #   - Smoke test post-deploy hit /healthz
    #   - External uptime monitoring (e.g., UptimeRobot)
    #   - Tidak ada data leak — cuma 200 OK / 503 status
    #
    # Lihat ADR-0016 (security posture).
    alb.ingress.kubernetes.io/actions.deny-internal: |
      {"Type":"fixed-response","FixedResponseConfig":{"ContentType":"text/plain","StatusCode":"404","MessageBody":"Not Found"}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.domain }}]
      secretName: parkir-tls
  {{- end }}
  rules:
    -
      {{- if .Values.global.domain }}
      host: {{ .Values.global.domain }}
      {{- end }}
      http:
        paths:
          # Priority order: more specific path first.
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          # /docs Prefix — catch /docs, /docs/, /docs/anything (asset Swagger UI).
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: deny-internal
                port:
                  name: use-annotation
          # Catch-all untuk business endpoint + /healthz + /readyz.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
{{- end }}

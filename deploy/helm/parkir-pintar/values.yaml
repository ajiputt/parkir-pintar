# Default values — production-ish.
# Override per env: values.dev.yaml, values.prod.yaml.

global:
  imageRegistry: ghcr.io/ajiperdana
  imagePullPolicy: IfNotPresent
  imageTag: latest
  env: production
  domain: parkirpintar.example.com
  storageClass: gp3

# ---- Per-service config ----
services:
  gateway:
    enabled: true
    replicas: 3
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70

  reservation:
    enabled: true
    replicas: 3
    grpcPort: 9091
    httpPort: 9191
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: 1, memory: 512Mi }
    holdDuration: "1h"
    expiryScanInterval: "30s"
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70

  billing:
    enabled: true
    replicas: 2
    httpPort: 9192
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }

  payment:
    enabled: true
    replicas: 2
    httpPort: 9193
    midtrans:
      mockMode: false
      serverKeySecret: parkir-secrets
      serverKeySecretKey: midtrans-server-key
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }

  # search & presence: deferred (lihat ADR-0009).
  # Kalau perlu di-restore, set enabled: true dan restore image build.
  search:
    enabled: false
    replicas: 1
    httpPort: 9194

  presence:
    enabled: false
    replicas: 1
    httpPort: 9195

  notification:
    enabled: true
    replicas: 1
    httpPort: 9196

# ---- Ingress (NGINX / OpenShift Route via templates) ----
ingress:
  enabled: true
  className: nginx          # OCP: gunakan Route via templates/route.yaml
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "100"
  tls:
    enabled: true

# ---- External dependencies ----
postgres:
  external: true
  host: postgres-rds.example.com
  port: 5432
  databaseSecret: parkir-secrets
  databaseSecretKey: db-url

redis:
  external: true
  addr: redis-elasticache.example.com:6379

nats:
  external: true
  url: nats://nats-cluster.example.com:4222
  stream: PARKIRPINTAR

# ---- Observability ----
opentelemetry:
  enabled: true
  endpoint: otel-collector.observability:4317

# ---- Security ----
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true
